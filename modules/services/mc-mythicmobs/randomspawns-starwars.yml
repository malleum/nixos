# Per-world themed spawns. Action ADD + config-spawning Generator: CLUSTER makes
# MythicMobs proactively find spawn points around players and spawn the themed
# mob there. This is required because the custom Star Wars maps produce almost
# no natural vanilla spawns (lit builds, few spawnable blocks), so the old
# Action: REPLACE approach (hooks a vanilla spawn and swaps it) left worlds empty.
#
# Density is throttled by Cooldown (seconds between spawns at a given point) plus
# the server mob cap. Bump Cooldown / drop Chance if a world feels too busy.
# End is intentionally left vanilla (endermen/shulkers).

# ===================== GEONOSIS — execution arena, droid army =====================
geo_pillager:   {Type: sw_pillager,   Worlds: geonosis_battle, Action: ADD, Reason: NATURAL, Priority: 1, Chance: 0.45, Cooldown: 30}
geo_vindicator: {Type: sw_vindicator, Worlds: geonosis_battle, Action: ADD, Reason: NATURAL, Priority: 1, Chance: 0.30, Cooldown: 35}
geo_husk:       {Type: sw_husk,       Worlds: geonosis_battle, Action: ADD, Reason: NATURAL, Priority: 1, Chance: 0.20, Cooldown: 40}
geo_ravager:    {Type: sw_ravager,    Worlds: geonosis_battle, Action: ADD, Reason: NATURAL, Priority: 2, Chance: 0.05, Cooldown: 90}
# sparse desert food
geo_rabbit:     {Type: sw_rabbit,     Worlds: geonosis_battle, Action: ADD, Reason: NATURAL, Priority: 1, Chance: 0.40, Cooldown: 50}


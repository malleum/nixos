# Per-world themed spawns. Action REPLACE swaps a natural spawn for the themed
# mob, so overall density tracks the vanilla spawn cycle (not overwhelming).
# HOSTILE entries replace natural hostile spawns; PASSIVE entries (Reason PASSIVE)
# replace natural animal spawns. Tune Chance in-game if a world feels too
# busy/empty. End is intentionally left vanilla (endermen/shulkers).

# ===================== GEONOSIS — execution arena, droid army =====================
geo_pillager:   {Type: sw_pillager,   Worlds: geonosis_battle, Action: REPLACE, Priority: 1, Chance: 0.45}
geo_vindicator: {Type: sw_vindicator, Worlds: geonosis_battle, Action: REPLACE, Priority: 1, Chance: 0.30}
geo_husk:       {Type: sw_husk,       Worlds: geonosis_battle, Action: REPLACE, Priority: 1, Chance: 0.20}
geo_ravager:    {Type: sw_ravager,    Worlds: geonosis_battle, Action: REPLACE, Priority: 2, Chance: 0.05}
# sparse desert food
geo_rabbit:     {Type: sw_rabbit,     Worlds: geonosis_battle, Action: REPLACE, Priority: 1, Chance: 0.60}

